<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Map • Admin • Prodigy Connect</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <div class="app">
    <div id="sidebar"></div>

    <main class="main-content">
      <h2>Service Map</h2>
      <p class="sub">Find service providers near you</p>

      <div class="map-layout">
        <div class="map-list">
          <div class="row">
            <strong>Plumbing Services</strong><br>
            <span class="sub">Downtown • 1.2 mi</span>
          </div>
          <div class="row">
            <strong>Math Tutoring</strong><br>
            <span class="sub">Midtown • 2.8 mi</span>
          </div>
          <div class="row">
            <strong>Landscaping</strong><br>
            <span class="sub">Elk Grove • 15.3 mi</span>
          </div>
          <div class="row">
            <strong>Web Development</strong><br>
            <span class="sub">Downtown • 0.8 mi</span>
          </div>
        </div>

        <div class="map-frame">
          <iframe
            title="Map"
            src="https://www.openstreetmap.org/export/embed.html?bbox=-121.60%2C38.45%2C-121.30%2C38.70&layer=mapnik"
            style="border:0;width:100%;height:100%;"
          ></iframe>
        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>
</body>
</html>
