<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Prodigy Connect</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-wrapper">

    <!-- Top navigation -->
    <div class="auth-nav">
      <!-- Back to homepage -->
      <button class="back-btn" onclick="window.location.href='/index.html'">← Back</button>

      <!-- Admin login page -->
      <button class="admin-btn" onclick="window.location.href='/admin/login.html'">Admin Login</button>
    </div>

    <!-- Signup card -->
    <div class="auth-card">
      <img src="/images/logo.png" alt="Prodigy Connect" class="logo" />

      <h2>Welcome to Prodigy Connect</h2>
      <p class="subtitle">Sign in or create your account</p>

      <!-- Tabs -->
      <div class="tabs">
        <!-- Goes to login page inside the same folder -->
        <button class="tab" onclick="window.location.href='login.html'">Login</button>

        <!-- Current page -->
        <button class="tab active" onclick="window.location.href='signup.html'">Sign Up</button>
      </div>

      <!-- Sign Up Form -->
      <form>
        <label>Full Name</label>
        <input type="text" placeholder="John Doe" required />

        <label>Email</label>
        <input type="email" placeholder="your@email.com" required />

        <label>Password</label>
        <input type="password" placeholder="********" required />

        <label>I am a...</label>
        <select required>
          <option value="seeker">Service Seeker</option>
          <option value="provider">Service Provider</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <!-- Divider -->
      <div class="divider">Quick Demo Access</div>

      <!-- Demo Buttons -->
      <div class="demo-buttons">

        <!-- DEMO SEEKER → service seeker dashboard -->
        <button class="demo-btn"
          onclick="window.location.href='/service_seeker/service_seeker.html'">
          Demo as Service Seeker
        </button>

        <!-- DEMO PROVIDER → provider dashboard (customize path if different) -->
        <button class="demo-btn"
          onclick="window.location.href='/service_provider/provider_dashboard.html'">
          Demo as Service Provider
        </button>

        <!-- DEMO ADMIN → admin dashboard -->
        <button class="demo-btn"
          onclick="window.location.href='/admin/admin_dashboard.html'">
          Demo as Admin
        </button>
      </div>

    </div>
  </div>

</body>
</html>
