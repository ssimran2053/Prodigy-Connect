<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Services • Admin • Prodigy Connect</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <div class="app">
    <div id="sidebar"></div>

    <main class="main-content">
      <h2>Browse Services</h2>
      <p class="sub">Discover trusted service providers in your community</p>

      <input class="search-bar" placeholder="Search services…" />

      <div class="services-grid">
        <div class="service-card">
          <img src="https://images.unsplash.com/photo-1581091870622-7d87f0b89d9f?q=80&w=800&auto=format&fit=crop" alt="Plumbing">
          <h3>Professional Plumbing Services</h3>
          <p>Expert repairs, installations, and maintenance.</p>
          <button class="btn btn--pill">View Details</button>
        </div>
        <div class="service-card">
          <img src="https://images.unsplash.com/photo-1556012018-50c5c0da73bf?q=80&w=800&auto=format&fit=crop" alt="Tutoring">
          <h3>Math &amp; Science Tutoring</h3>
          <p>Personalized tutoring for grades 6–12.</p>
          <button class="btn btn--pill">View Details</button>
        </div>
        <div class="service-card">
          <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=800&auto=format&fit=crop" alt="Garden">
          <h3>Garden &amp; Landscape Design</h3>
          <p>Beautiful, functional outdoor spaces.</p>
          <button class="btn btn--pill">View Details</button>
        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>
</body>
</html>
