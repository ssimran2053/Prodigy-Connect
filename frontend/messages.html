<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages • Admin • Prodigy Connect</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <div class="app">
    <div id="sidebar"></div>

    <main class="main-content">
      <h2>Messages</h2>
      <p class="sub">Communicate with service providers and seekers</p>

      <div class="messages-wrapper">
        <div class="conversation-list">
          <div class="user"><span>Tom Richards</span><span>2d</span></div>
          <div class="user"><span>Lisa Martinez</span><span>18h</span></div>
          <div class="user"><span>James Wilson</span><span>1m</span></div>
        </div>

        <div class="chat-box">
          <div class="chat-header">James Wilson</div>
          <div class="messages-area">
            <div class="msg inbound">
              I can’t log into my account. The password reset isn’t working.
            </div>
            <div class="msg outbound">
              I’ll help you with that. Can you confirm your email address?
            </div>
            <div class="msg inbound">
              james.wilson@email.com
            </div>
          </div>
          <input class="msg-input" placeholder="Type a message…" />
        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>
</body>
</html>
