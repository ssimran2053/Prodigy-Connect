<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Prodigy Connect</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-wrapper">

    <!-- Top navigation -->
    <div class="auth-nav">
      <button class="back-btn" onclick="window.location.href='/'">← Back</button>
      <button class="admin-btn" onclick="window.location.href='admin_login.html'">Admin Login</button>
    </div>

    <!-- Login form -->
    <div class="auth-card">
      <img src="/images/logo.png" alt="Prodigy Connect" class="logo" />

      <h2>Welcome to Prodigy Connect</h2>
      <p class="subtitle">Sign in or create your account</p>

      <div class="tabs">
        <button class="tab active" onclick="window.location.href='login.html'">Login</button>
        <button class="tab" onclick="window.location.href='signup.html'">Sign Up</button>
      </div>

      <form>
        <label>Email</label>
        <input type="email" placeholder="your@email.com" required />

        <label>Password</label>
        <input type="password" placeholder="********" required />

        <button type="submit" class="btn-primary">Sign In</button>

        <a href="#" class="forgot">Forgot Password</a>
      </form>

      <div class="divider">Quick Demo Access</div>
      <div class="demo-buttons">
        <button class="demo-btn" onclick="window.location.href='/service_seeker/service_seeker.html'">Demo as Service Seeker</button>
        <button class="demo-btn">Demo as Service Provider</button>
        <button class="demo-btn">Demo as Admin</button>
      </div>
    </div>
  </div>
</body>
</html>
